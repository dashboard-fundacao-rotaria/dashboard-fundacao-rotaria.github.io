name: Atualizar Dólar Rotário

# Busca o valor oficial do Dólar Rotário em rotary.org.br e grava em
# assets/dolar-rotario.json — o site lê esse arquivo (mesmo domínio, sem
# CORS) pra mostrar o câmbio na navbar. Roda sozinho, sem precisar de
# ninguém editar código todo mês.
on:
  schedule:
    - cron: "0 12 * * *" # todo dia, 12:00 UTC (09:00 no horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar e gravar o valor do Dólar Rotário
        run: python3 .github/scripts/atualizar_dolar_rotario.py

      - name: Commitar se o valor mudou
        run: |
          if git diff --quiet -- assets/dolar-rotario.json; then
            echo "Sem mudança no Dólar Rotário — nada pra commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/dolar-rotario.json
          git commit -m "Atualiza Dólar Rotário automaticamente"
          git push
